<script>
  // Dark mode preload — prevents white flash on refresh
  (function() {
    try {
      var darkPref = localStorage.getItem('openhr-dark-mode') || 'system';
      var isDark = darkPref === 'dark' ||
        (darkPref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        // Apply dark class immediately — the .dark CSS rules in the static
        // hero <style> block handle background/text overrides for both the
        // skeleton and body, so no element lookups are needed here.
        document.documentElement.classList.add('dark');

        // Update theme-color meta tag to dark
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#0f172a');
      }
    } catch(e) {}
  })();
</script>

<script>
  // Capture install prompt event (must be inline, not in ESM module,
  // because on slower devices beforeinstallprompt fires before modules load)
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    window.deferredPWAPrompt = e;
    window.dispatchEvent(new CustomEvent('pwa-install-available'));
    console.log('PWA: Install prompt captured');
  });

  // Track successful installation
  window.addEventListener('appinstalled', function() {
    console.log('PWA: Successfully installed');
    window.deferredPWAPrompt = null;
    window.dispatchEvent(new CustomEvent('pwa-installed'));
  });
</script>
